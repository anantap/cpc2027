<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Couch to 5K importeren</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: #0f0f0f;
    color: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #8f8f8f; line-height: 1.5; margin: 0 0 20px; }
  label { display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #8f8f8f; margin: 16px 0 6px; }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    background: #1f1f1f;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #ededed;
    font: 14px/1.4 ui-monospace, Menlo, monospace;
    padding: 12px;
  }
  textarea { height: 180px; }
  button {
    margin-top: 20px;
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 999px;
    background: #62466b;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }
  #result { margin-top: 16px; color: #b39bbd; }
</style>
</head>
<body>
<main>
  <h1>Couch to 5K importeren</h1>
  <p>Plak de lijst met runs en vul je Intervals.icu athlete ID in (bijv. i123456). De runs worden privé opgeslagen en verschijnen daarna in je trainingsplan.</p>
  <label for="athlete">Athlete ID</label>
  <input id="athlete" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="runs">Runs</label>
  <textarea id="runs" spellcheck="false"></textarea>
  <button id="go" type="button">Importeren</button>
  <div id="result"></div>
</main>
<script>
  document.getElementById('go').addEventListener('click', function () {
    var result = document.getElementById('result');
    var runs;
    try {
      runs = JSON.parse(document.getElementById('runs').value);
    } catch (e) {
      result.textContent = 'De lijst met runs is geen geldige tekst; plak hem opnieuw.';
      return;
    }
    result.textContent = 'Bezig…';
    fetch('/api/c25k', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ athlete: document.getElementById('athlete').value, runs: runs }),
    }).then(function (res) {
      return res.text().then(function (body) {
        if (!res.ok) throw new Error(body);
        result.innerHTML = JSON.parse(body).runs + ' runs geïmporteerd. <a href="/" style="color:#ededed">Naar het trainingsplan</a>';
      });
    }).catch(function (err) {
      result.textContent = 'Mislukt: ' + err.message;
    });
  });
</script>
</body>
</html>
